name: foodbridge_mobile
description: "FoodBridge - Save Food. Feed People. Cross-Platform Flutter Mobile Application for Android & iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  badges: ^3.1.2

  # Networking & State
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # Maps & QR Code
  google_maps_flutter: ^2.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
